<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gerador de post · DiPixels Games</title>
<meta name="theme-color" content="#070B16">
<link rel="icon" href="assets/avatar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#070B16;color:#E8EEF9;font:16px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:24px 18px 48px}
h1{font-family:'Space Grotesk',sans-serif;font-size:28px;margin:0 0 4px;color:#fff}
.sub{color:#9AA8C2;margin:0 0 18px;font-size:15px}
.lojas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 6px;padding:0;border:0}
.lojas legend{font-weight:600;font-size:14px;margin-bottom:6px;color:#D3DCEC;padding:0}
.lojas input{position:absolute;opacity:0;pointer-events:none}
.lojas label{display:flex;align-items:center;justify-content:center;min-height:48px;margin:0;border-radius:12px;background:#0F1626;border:1px solid #2A3B5E;font-weight:700;font-size:15px;cursor:pointer;color:#B7C3DA;text-align:center;line-height:1.2;padding:4px}
.lojas input:checked+label{background:var(--cor);border-color:var(--cor);color:var(--txt)}
.lojas input:focus-visible+label{outline:2px solid #fff;outline-offset:2px}
label{display:block;font-weight:600;font-size:14px;margin:16px 0 6px;color:#D3DCEC}
input[type=text],input[type=url],textarea{width:100%;font:inherit;font-size:16px;color:#fff;background:#0F1626;border:1px solid #2A3B5E;border-radius:12px;padding:12px 14px;min-height:48px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid #F5B82E;outline-offset:2px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.hint{font-size:13px;color:#8391AD;margin-top:6px}
.hint.ok{color:#7BD88F}.hint.warn{color:#F5B82E}
.dica{background:#0E1A33;border:1px solid #1B2A4A;border-radius:12px;padding:12px 14px;font-size:14px;color:#B7C3DA;margin-top:12px}
.dica b{color:#fff}
textarea{min-height:220px;font-family:inherit;white-space:pre-wrap;margin-top:6px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;min-height:48px;cursor:pointer}
.gold{background:#F5B82E;color:#0A0F1C}.ghost{background:#14213D;color:#E8EEF9}
.out{margin-top:26px;border-top:1px solid #1B2A4A;padding-top:6px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="wrap">
<h1>Gerador de post</h1>
<p class="sub">Escolha a loja, cole o link e preencha. O post do grupo sai pronto. No WhatsApp, espere a prévia com a foto aparecer antes de enviar.</p>

<fieldset class="lojas">
<legend>Loja</legend>
<input type="radio" name="loja" id="l-amazon" value="amazon" checked><label for="l-amazon" style="--cor:#F5B82E;--txt:#0A0F1C">Amazon</label>
<input type="radio" name="loja" id="l-shopee" value="shopee"><label for="l-shopee" style="--cor:#EE4D2D;--txt:#fff">Shopee</label>
<input type="radio" name="loja" id="l-ml" value="ml"><label for="l-ml" style="--cor:#FFE600;--txt:#2D3277">Mercado Livre</label>
</fieldset>
<div id="dica" class="dica"></div>

<label for="url" id="urlLabel">Link do produto</label>
<input id="url" type="url" inputmode="url" autocomplete="off">
<div id="urlHint" class="hint"></div>

<label for="nome">Nome do produto</label>
<input id="nome" type="text" placeholder="Ex.: Monitor LG UltraGear 27&quot; 240Hz IPS 1ms" autocomplete="off">

<div class="row">
<div><label for="de">Preço antigo (opcional)</label><input id="de" type="text" inputmode="decimal" placeholder="1299,90" autocomplete="off"></div>
<div><label for="preco">Preço da oferta</label><input id="preco" type="text" inputmode="decimal" placeholder="1099,90" autocomplete="off"></div>
</div>

<label for="extra">Condição (opcional)</label>
<input id="extra" type="text" placeholder="em 10x sem juros" autocomplete="off">

<label for="cupom">Cupom (opcional)</label>
<input id="cupom" type="text" placeholder="CANARINHO" autocomplete="off">

<div id="boxCupons" hidden>
<label for="cupons">Link da página de cupons (opcional)</label>
<input id="cupons" type="url" inputmode="url" placeholder="https://s.shopee.com.br/..." autocomplete="off">
<div class="hint">Aparece no post como "Resgate todos os cupons dessa página".</div>
</div>

<div class="out">
<label for="post">Post pronto</label>
<textarea id="post" readonly></textarea>
<div class="btns">
<button class="gold" id="copiarPost" type="button">Copiar post</button>
<button class="ghost" id="copiarLink" type="button">Copiar só o link</button>
<button class="ghost" id="limpar" type="button">Limpar</button>
</div>
<div id="status" class="hint" role="status"></div>
</div>
</main>
<script>
{
const TAG = 'dipixelsgames-20';
const $ = id => document.getElementById(id);
const campos = ['url','nome','de','preco','extra','cupom','cupons'];

const LOJAS = {
  amazon: {
    placeholder: 'https://www.amazon.com.br/... ou https://link.amazon/...',
    dica: '<b>Amazon:</b> cole o link da página do produto e a tag <b>dipixelsgames-20</b> entra sozinha. Também aceita o link curto do SiteStripe (link.amazon / amzn.to).'
  },
  shopee: {
    placeholder: 'https://s.shopee.com.br/...',
    dica: '<b>Shopee:</b> gere o link no app ou no painel <b>Shopee Afiliados</b> (opção "Obter link") e cole aqui. O link normal da página não paga comissão.'
  },
  ml: {
    placeholder: 'https://mercadolivre.com/sec/...',
    dica: '<b>Mercado Livre:</b> gere o link no painel do <b>Programa de Afiliados</b> do Mercado Livre e cole aqui. O link normal da página não paga comissão.'
  }
};

function lojaAtual(){ return document.querySelector('input[name=loja]:checked').value; }

function detectarLoja(u){
  if(/(amazon\.com\.br|amzn\.to|link\.amazon|(^|\/\/)a\.co\/)/i.test(u)) return 'amazon';
  if(/(shopee\.com\.br|shope\.ee)/i.test(u)) return 'shopee';
  if(/(mercadolivre\.com|mercadolibre\.com|meli\.la)/i.test(u)) return 'ml';
  return null;
}

function analisarLink(bruto, loja){
  const u = bruto.trim();
  if(!u) return {link:'', msg:'', cls:''};
  if(loja === 'amazon'){
    if(/(^|\/\/|\.)(amzn\.to|link\.amazon|a\.co)\//i.test(u))
      return {link:u, msg:'Link curto da Amazon: vale se foi gerado na sua conta (SiteStripe) ✓', cls:'ok'};
    if(/(^|[\/.])amazon\.com\.br\//i.test(u)){
      const m = u.match(/\/(?:dp|gp\/product|gp\/aw\/d)\/([A-Z0-9]{10})/i);
      if(m) return {link:`https://www.amazon.com.br/dp/${m[1].toUpperCase()}?tag=${TAG}`, msg:'Tag de afiliado adicionada ✓', cls:'ok'};
      try{ const x = new URL(u); x.searchParams.set('tag', TAG); return {link:x.toString(), msg:'Tag de afiliado adicionada ✓', cls:'ok'}; }
      catch(e){ return {link:u, msg:'Não consegui ler esse link. Confira se copiou inteiro.', cls:'warn'}; }
    }
    return {link:u, msg:'Esse link não parece da Amazon.', cls:'warn'};
  }
  if(loja === 'shopee'){
    if(/(s\.shopee\.com\.br|shope\.ee)\//i.test(u)) return {link:u, msg:'Link curto de afiliado da Shopee ✓', cls:'ok'};
    if(/shopee\.com\.br/i.test(u)) return {link:u, msg:'Esse parece o link normal da página. Gere o seu no Shopee Afiliados pra ganhar comissão.', cls:'warn'};
    return {link:u, msg:'Esse link não parece da Shopee.', cls:'warn'};
  }
  if(loja === 'ml'){
    if(/(mercadolivre\.com\/sec\/|meli\.la\/)/i.test(u)) return {link:u, msg:'Link de afiliado do Mercado Livre ✓', cls:'ok'};
    if(/(mercadolivre|mercadolibre)\./i.test(u)) return {link:u, msg:'Se esse não for o link gerado no painel de afiliados, gere o seu lá pra ganhar comissão.', cls:'warn'};
    return {link:u, msg:'Esse link não parece do Mercado Livre.', cls:'warn'};
  }
  return {link:u, msg:'', cls:''};
}

function formatarPreco(p){
  const s = p.replace(/[^\d,.]/g,'');
  if(!s) return '';
  let n;
  if(s.includes(',')) n = parseFloat(s.replace(/\./g,'').replace(',','.'));
  else if((s.match(/\./g)||[]).length>1 || /\.\d{3}$/.test(s)) n = parseFloat(s.replace(/\./g,''));
  else n = parseFloat(s);
  if(!isFinite(n)) return p.trim();
  return 'R$ ' + n.toLocaleString('pt-BR',{minimumFractionDigits: n%1 ? 2 : 0, maximumFractionDigits:2});
}

function trocarLoja(){
  const loja = lojaAtual();
  $('dica').innerHTML = LOJAS[loja].dica;
  $('url').placeholder = LOJAS[loja].placeholder;
  $('urlLabel').textContent = loja === 'amazon' ? 'Link do produto' : 'Seu link de afiliado';
  $('boxCupons').hidden = loja !== 'shopee';
  atualizar();
}

function atualizar(){
  const loja = lojaAtual();
  const {link, msg, cls} = analisarLink($('url').value, loja);
  const h = $('urlHint'); h.textContent = msg; h.className = 'hint' + (cls ? ' ' + cls : '');

  const nome = $('nome').value.trim().toUpperCase();
  const preco = formatarPreco($('preco').value);
  const de = formatarPreco($('de').value);
  const extra = $('extra').value.trim();
  const cupom = $('cupom').value.trim();
  const cupons = loja === 'shopee' ? $('cupons').value.trim() : '';

  const linhas = [];
  if(nome) linhas.push('🚨 ' + nome, '');
  if(preco){
    let lp = de ? `De ~${de}~ Por *${preco}*` : `💵 *${preco}*`;
    if(extra) lp += ' ' + extra;
    linhas.push(lp);
  }
  if(cupom) linhas.push('🎟️ Use o cupom: ' + cupom);
  // o link do produto vem antes: o WhatsApp monta a prévia (foto) a partir do primeiro link
  if(link){ if(preco||cupom) linhas.push(''); linhas.push('✅ Link do produto:', link); }
  if(cupons) linhas.push('', '🎟️ Resgate todos os cupons dessa página:', cupons);
  if(linhas.length) linhas.push('', 'anúncio');
  $('post').value = linhas.join('\n');
  $('post').dataset.link = link;
}

async function copiar(texto, msg){
  const st = $('status');
  if(!texto){ st.textContent = 'Preencha os campos primeiro.'; st.className='hint warn'; return; }
  try{ await navigator.clipboard.writeText(texto); st.textContent = msg; st.className='hint ok'; }
  catch(e){ $('post').select(); st.textContent = 'Não deu pra copiar sozinho: o texto ficou selecionado, use Copiar do celular.'; st.className='hint warn'; }
}

document.querySelectorAll('input[name=loja]').forEach(r => r.addEventListener('change', trocarLoja));
$('url').addEventListener('input', () => {
  const d = detectarLoja($('url').value);
  if(d && d !== lojaAtual()){ $('l-' + d).checked = true; trocarLoja(); }
});
campos.forEach(c => $(c).addEventListener('input', atualizar));
$('copiarPost').addEventListener('click', () => copiar($('post').value, 'Post copiado! É só colar no grupo.'));
$('copiarLink').addEventListener('click', () => copiar($('post').dataset.link || '', 'Link copiado!'));
$('limpar').addEventListener('click', () => { campos.forEach(c => $(c).value=''); $('status').textContent=''; atualizar(); $('url').focus(); });
trocarLoja();
}
</script>
</body>
</html>
