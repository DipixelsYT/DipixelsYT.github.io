<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gerador de post · DiPixels Games</title>
<meta name="theme-color" content="#070B16">
<link rel="icon" href="assets/avatar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#070B16;color:#E8EEF9;font:16px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:24px 18px 48px}
h1{font-family:'Space Grotesk',sans-serif;font-size:28px;margin:0 0 4px;color:#fff}
.sub{color:#9AA8C2;margin:0 0 22px;font-size:15px}
label{display:block;font-weight:600;font-size:14px;margin:16px 0 6px;color:#D3DCEC}
input,textarea{width:100%;font:inherit;font-size:16px;color:#fff;background:#0F1626;border:1px solid #2A3B5E;border-radius:12px;padding:12px 14px;min-height:48px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid #F5B82E;outline-offset:2px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.hint{font-size:13px;color:#8391AD;margin-top:6px}
.hint.ok{color:#7BD88F}.hint.warn{color:#F5B82E}
textarea{min-height:190px;font-family:inherit;white-space:pre-wrap;margin-top:6px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;min-height:48px;cursor:pointer}
.gold{background:#F5B82E;color:#0A0F1C}.ghost{background:#14213D;color:#E8EEF9}
.out{margin-top:26px;border-top:1px solid #1B2A4A;padding-top:6px}
</style>
</head>
<body>
<main class="wrap">
<h1>Gerador de post</h1>
<p class="sub">Cola o link da Amazon: o link de afiliado e o post do grupo saem prontos. No WhatsApp, espere a prévia com a foto aparecer antes de enviar.</p>

<label for="url">Link do produto</label>
<input id="url" type="url" inputmode="url" placeholder="https://www.amazon.com.br/..." autocomplete="off">
<div id="urlHint" class="hint">Amazon: a tag dipixelsgames-20 entra sozinha. Outras lojas: cole o link de afiliado gerado no painel da loja.</div>

<label for="nome">Nome do produto</label>
<input id="nome" type="text" placeholder="Ex.: Monitor LG UltraGear 27&quot; 240Hz IPS 1ms" autocomplete="off">

<div class="row">
<div><label for="de">Preço antigo (opcional)</label><input id="de" type="text" inputmode="decimal" placeholder="1299,90" autocomplete="off"></div>
<div><label for="preco">Preço da oferta</label><input id="preco" type="text" inputmode="decimal" placeholder="1099,90" autocomplete="off"></div>
</div>
<label for="cupom">Cupom (opcional)</label><input id="cupom" type="text" placeholder="CANARINHO" autocomplete="off">

<div class="out">
<label for="post">Post pronto</label>
<textarea id="post" readonly></textarea>
<div class="btns">
<button class="gold" id="copiarPost" type="button">Copiar post</button>
<button class="ghost" id="copiarLink" type="button">Copiar só o link</button>
<button class="ghost" id="limpar" type="button">Limpar</button>
</div>
<div id="status" class="hint" role="status"></div>
</div>
</main>
<script>
{
const TAG = 'dipixelsgames-20';
const $ = id => document.getElementById(id);
const campos = ['url','nome','de','preco','cupom'];

function linkAfiliado(bruto){
  const u = bruto.trim();
  if(!u) return {link:'', tipo:''};
  if(/(^|\/\/|\.)(amzn\.to|link\.amazon|a\.co)\//i.test(u)) return {link:u, tipo:'curto'};
  if(/(^|[\/.])amazon\.com\.br\//i.test(u)){
    const m = u.match(/\/(?:dp|gp\/product|gp\/aw\/d)\/([A-Z0-9]{10})/i);
    if(m) return {link:`https://www.amazon.com.br/dp/${m[1].toUpperCase()}?tag=${TAG}`, tipo:'amazon'};
    try{ const x = new URL(u); x.searchParams.set('tag', TAG); return {link:x.toString(), tipo:'amazon'}; }
    catch(e){ return {link:u, tipo:'erro'}; }
  }
  return {link:u, tipo:'outra'};
}

function formatarPreco(p){
  const s = p.replace(/[^\d,.]/g,'');
  if(!s) return '';
  let n;
  if(s.includes(',')) n = parseFloat(s.replace(/\./g,'').replace(',','.'));
  else if((s.match(/\./g)||[]).length>1 || /\.\d{3}$/.test(s)) n = parseFloat(s.replace(/\./g,''));
  else n = parseFloat(s);
  if(!isFinite(n)) return p.trim();
  return 'R$ ' + n.toLocaleString('pt-BR',{minimumFractionDigits: n%1 ? 2 : 0, maximumFractionDigits:2});
}

function atualizar(){
  const {link, tipo} = linkAfiliado($('url').value);
  const h = $('urlHint');
  h.className = 'hint';
  if(tipo==='amazon'){ h.textContent = 'Tag de afiliado adicionada ✓'; h.classList.add('ok'); }
  else if(tipo==='curto'){ h.textContent = 'Link curto da Amazon: vale se foi gerado na sua conta (SiteStripe) ✓'; h.classList.add('ok'); }
  else if(tipo==='outra'){ h.textContent = 'Não é Amazon: confira se é o seu link de afiliado da loja.'; h.classList.add('warn'); }
  else if(tipo==='erro'){ h.textContent = 'Não consegui ler esse link. Confira se copiou inteiro.'; h.classList.add('warn'); }

  const nome = $('nome').value.trim().toUpperCase();
  const preco = formatarPreco($('preco').value);
  const de = formatarPreco($('de').value);
  const cupom = $('cupom').value.trim();
  const linhas = [];
  if(nome) linhas.push('🚨 ' + nome, '');
  if(preco) linhas.push(de ? `De ~${de}~ Por *${preco}*` : `💵 *${preco}*`);
  if(cupom) linhas.push('🎟️ Use o cupom: ' + cupom);
  if(link){ if(preco||cupom) linhas.push(''); linhas.push('✅ Link do produto:', link); }
  if(linhas.length) linhas.push('', 'anúncio');
  $('post').value = linhas.join('\n');
  $('post').dataset.link = link;
}

async function copiar(texto, msg){
  const st = $('status');
  if(!texto){ st.textContent = 'Preencha os campos primeiro.'; st.className='hint warn'; return; }
  try{ await navigator.clipboard.writeText(texto); st.textContent = msg; st.className='hint ok'; }
  catch(e){ $('post').select(); st.textContent = 'Não deu pra copiar sozinho: o texto ficou selecionado, use Copiar do celular.'; st.className='hint warn'; }
}

campos.forEach(c => $(c).addEventListener('input', atualizar));
$('copiarPost').addEventListener('click', () => copiar($('post').value, 'Post copiado! É só colar no grupo.'));
$('copiarLink').addEventListener('click', () => copiar($('post').dataset.link || '', 'Link copiado!'));
$('limpar').addEventListener('click', () => { campos.forEach(c => $(c).value=''); $('status').textContent=''; atualizar(); $('url').focus(); });
atualizar();
}
</script>
</body>
</html>
